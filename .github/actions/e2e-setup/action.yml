name: E2E setup
description: >-
  Shared setup for the e2e jobs: pnpm/Node/Python toolchain, dependency
  install, local Langfuse server, and the e2e dataset. The calling job must
  run actions/checkout first — a local composite action can only be resolved
  after the repository is checked out. Langfuse credentials are read at
  runtime from the job's LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY /
  LANGFUSE_BASE_URL env vars.

# Composite actions can't reliably read workflow-level `env` in expression
# contexts, so versions and dataset parameters are explicit inputs.
inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: true
  python-version:
    description: Python version passed to actions/setup-python
    required: true
  dataset-name:
    description: Name of the Langfuse dataset to create
    required: true
  dataset-description:
    description: Description of the Langfuse dataset
    required: true
  dataset-items:
    description: >-
      JSON array of dataset items, each with "input" and "expected_output"
      keys, consumed by scripts/create-e2e-dataset.py
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        run_install: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        package-manager-cache: false
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Start Langfuse server
      run: pnpm run dev:up
      shell: bash
    - name: Wait for Langfuse to be healthy
      run: pnpm run dev:wait
      shell: bash
    - name: Install Python SDK for dataset setup
      run: python -m pip install --disable-pip-version-check --quiet langfuse
      shell: bash
    - name: Create E2E dataset
      env:
        DATASET_NAME: ${{ inputs.dataset-name }}
        DATASET_DESCRIPTION: ${{ inputs.dataset-description }}
        DATASET_ITEMS: ${{ inputs.dataset-items }}
      run: python scripts/create-e2e-dataset.py
      shell: bash
