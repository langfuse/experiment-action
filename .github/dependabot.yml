# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: npm
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: "increase"
    assignees:
      - wochinge
    ignore:
      # TypeScript 7.0.x ships as the native/Go compiler rewrite and breaks
      # typescript-eslint and the dist/ build (ncc). Unblock once 7.1 lands
      # the API that restores typescript-eslint support.
      - dependency-name: "typescript"
        versions: [">= 7.0.0, < 7.1.0"]
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees:
      - wochinge
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
