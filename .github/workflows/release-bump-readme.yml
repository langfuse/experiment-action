name: Bump README on release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-readme:
    name: Open PR to pin README examples to the new release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          # Full history so `git rev-list` can resolve the release tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Bump README pins
        id: bump
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SHA=$(git rev-list -n 1 "$TAG")
          echo "Release ${TAG} points at ${SHA}"
          node scripts/bump-readme-pin.mjs "$SHA" "$TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      # Open a PR rather than pushing straight to main — works regardless
      # of branch protection and keeps a reviewable audit trail.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          token: ${{ github.token }}
          branch: bot/bump-readme-${{ steps.bump.outputs.tag }}
          base: main
          commit-message: "docs: pin README examples to ${{ steps.bump.outputs.tag }}"
          title: "docs: pin README examples to ${{ steps.bump.outputs.tag }}"
          body: |
            Auto-generated by `.github/workflows/release-bump-readme.yml` after
            the [${{ steps.bump.outputs.tag }}](${{ github.event.release.html_url }})
            release.

            Updates every `langfuse/experiment-action@…` reference in the README
            to `@${{ steps.bump.outputs.sha }} # ${{ steps.bump.outputs.tag }}`.
          labels: docs, automated
          delete-branch: true
      # Merge automatically once required status checks pass. Requires
      # "Allow auto-merge" to be enabled in the repository settings.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "$PR_URL"
